<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riesgos · Matriz MDP</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="app.css">
<script src="tema.js"></script>
<style>
.fichas { display: grid; gap: 14px; }
.ficha { background: var(--surface-1); border: 1px solid var(--borde);
         border-radius: var(--radio); overflow: hidden; }
/* Franja lateral con el nivel residual: se ve el estado del riesgo sin leer. */
.ficha { border-left: 4px solid var(--axis); }
.ficha[data-n="Bajo"]     { border-left-color: var(--nivel-bajo); }
.ficha[data-n="Moderado"] { border-left-color: var(--nivel-moderado); }
.ficha[data-n="Alto"]     { border-left-color: var(--nivel-alto); }
.ficha[data-n="Critico"]  { border-left-color: var(--nivel-critico); }

/* No reutilizar la clase .cuerpo: en app.css es el contenedor en flex que
   sostiene la barra lateral, y su display se filtraba hasta acá dejando la
   insignia de nivel pegada a los datos del riesgo, en la misma línea. */
.ficha-cuerpo { padding: 13px 16px; }
.ficha .alto { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.ficha .codigo { font-weight: 600; font-size: 12px; color: var(--ink-2);
                 font-variant-numeric: tabular-nums; white-space: nowrap; }
.ficha h3 { margin: 1px 0 4px; font-size: 13.5px; font-weight: 600; line-height: 1.35;
            flex: 1; min-width: 200px; }
.ficha .meta { font-size: 11px; color: var(--ink-muted); display: flex;
               gap: 6px 12px; flex-wrap: wrap; margin-top: 6px; line-height: 1.5; }
.ficha .alto .nivel { font-size: 11px; font-weight: 500; padding: 1px 8px; }
/* Las cifras viven dentro del panel «+ info», junto a la explicación de cómo
   se llegó a ellas; la ficha cerrada queda con el código, la descripción y el
   nivel, que es lo que se necesita para recorrer la lista. */
.info .cifras { display: grid; gap: 10px; margin: 0;
  grid-template-columns: repeat(auto-fit, minmax(min(112px, 100%), 1fr)); }
.cifra { background: var(--plane); border-radius: 8px; padding: 9px 12px; min-width: 0; }
.cifra .et { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px;
             color: var(--ink-muted); white-space: nowrap; }
.cifra .v  { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }
.cifra .sub-cifra { font-size: 11.5px; color: var(--ink-2); margin-top: 1px;
                    overflow: hidden; text-overflow: ellipsis; }
.ficha .pie { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
              padding: 10px 18px; background: var(--plane); border-top: 1px solid var(--grid); }

.info { padding: 0 18px 18px; border-top: 1px solid var(--grid); }
.info h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .4px;
           color: var(--ink-2); margin: 16px 0 6px; }
.info p { margin: 0; font-size: 13.5px; line-height: 1.6; }
.info ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.info .caja { background: var(--plane); border-radius: 8px; padding: 12px 14px; }
.sin-dato { color: var(--ink-muted); font-style: italic; font-size: 13px; }
/* Historial: cuatro grupos de tareas del riesgo, cada uno con su contador.
   El color de la cabecera es el del estado, no decoracion. */
.hist-resumen { display: grid; gap: 10px; margin-top: 2px;
  grid-template-columns: repeat(auto-fit, minmax(min(112px, 100%), 1fr)); }
.hist-grupo { margin-top: 14px; }
.hist-grupo > h5 { margin: 0 0 6px; font-size: 12.5px; font-weight: 600;
  display: flex; gap: 8px; align-items: baseline; }
.hist-grupo > h5::before { content: ''; width: 9px; height: 9px; border-radius: 50%;
  background: var(--axis); flex: none; }
.hist-grupo[data-g="sin-iniciar"] > h5::before { background: var(--ink-muted); }
.hist-grupo[data-g="en-proceso"]  > h5::before { background: var(--serie-1); }
.hist-grupo[data-g="completada"]  > h5::before { background: var(--nivel-bajo); }
.hist-grupo[data-g="cancelada"]   > h5::before { background: var(--axis); }
.hist-grupo > h5 .cuenta { color: var(--ink-muted); font-weight: 500; }
.hist-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hist-item { background: var(--plane); border-radius: 8px; padding: 9px 12px; min-width: 0; }
.hist-fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
a.hist-titulo { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 150px;
  color: var(--marca); text-decoration: none; }
a.hist-titulo:hover { text-decoration: underline; }
.hist-titulo { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 150px; }
.hist-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px;
  font-size: 11.5px; color: var(--ink-muted); }
.hist-meta .vencida { color: var(--nivel-critico); font-weight: 600; }
.etiqueta { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px;
  color: var(--ink-2); background: var(--surface-1); border: 1px solid var(--grid);
  border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.etiqueta.reservado { color: var(--nivel-critico); border-color: var(--nivel-critico); }
.filtros { display: grid; gap: 12px;
           grid-template-columns: repeat(auto-fit, minmax(min(170px,100%), 1fr)); }
</style>
</head>
<body>
<main>
  <h1>Riesgos</h1>
  <p class="sub">Cada riesgo identificado, con su explicación, sus controles y las tareas que tiene abiertas.</p>
  <div id="aviso" class="aviso error" hidden></div>

  <div class="tarjeta" style="margin-bottom:16px">
    <div class="filtros">
      <div><label for="f-factor">Factor</label><select id="f-factor"><option value="">Todos</option></select></div>
      <div><label for="f-nivel">Nivel residual</label><select id="f-nivel">
        <option value="">Todos</option><option>Bajo</option><option>Moderado</option>
        <option>Alto</option><option>Critico</option></select></div>
      <div><label for="f-estado">Estado</label><select id="f-estado">
        <option value="">Todos</option><option>Borrador</option><option>En revision</option>
        <option>Aprobado</option><option>Cerrado</option></select></div>
      <div><label for="f-buscar">Buscar</label><input id="f-buscar" placeholder="código o descripción"></div>
      <div style="align-self:end"><button class="primario" id="btn-nuevo" hidden style="width:100%">Nuevo riesgo</button></div>
    </div>
  </div>

  <div class="tarjeta" id="caja-form" hidden style="margin-bottom:16px">
    <h2 id="form-titulo">Nuevo riesgo</h2>
    <form id="form">
      <input type="hidden" id="r-id">
      <div class="fila">
        <div class="campo"><label for="r-codigo">Código</label><input id="r-codigo" required maxlength="30"></div>
        <div class="campo"><label for="r-factor">Factor</label><select id="r-factor" required></select></div>
        <div class="campo"><label for="r-subfactor">Subfactor</label><select id="r-subfactor"></select></div>
        <div class="campo"><label for="r-fecha">Fecha de identificación</label><input id="r-fecha" type="date" required></div>
      </div>
      <div class="campo"><label for="r-desc">Descripción breve</label>
        <textarea id="r-desc" rows="2" required maxlength="500"
          placeholder="Qué puede pasar, en una o dos líneas"></textarea></div>
      <div class="campo"><label for="r-contexto">Contexto (aparece en «+ info»)</label>
        <textarea id="r-contexto" rows="3" maxlength="2000"
          placeholder="Dónde se observó en la entidad, a qué área o proceso afecta, qué lo motivó"></textarea></div>
      <div class="fila">
        <div class="campo"><label for="r-prob">Probabilidad</label><select id="r-prob" required></select></div>
        <div class="campo"><label for="r-imp">Impacto</label><select id="r-imp" required></select></div>
        <div class="campo"><label for="r-resp">Responsable</label><select id="r-resp"><option value="">—</option></select></div>
        <div class="campo"><label>Riesgo inherente</label>
          <div style="padding-top:7px"><strong id="r-calc" style="font-size:18px">—</strong></div></div>
      </div>
      <div class="campo"><label for="r-ref">Referencia normativa o procedimiento</label>
        <input id="r-ref" maxlength="200" placeholder="Resolución, manual interno, artículo"></div>
      <div class="acciones">
        <button class="primario">Guardar</button>
        <button type="button" id="btn-cancelar">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="fichas" id="fichas"></div>
</main>

<script src="app.js"></script>
<script>
'use strict';
(async () => {
  const u = await MDP.iniciar({ permiso: 'riesgos.ver' });
  if (!u) return;
  const { ui, api, puede } = MDP;

  let cat = null, lista = [], abiertos = new Set(), detalles = {};
  let pag = 1; const POR_PAGINA = 8, UMBRAL_PAGINAR = 10;
  // Los paneles de historial abiertos y las tareas que ya trajimos de cada uno.
  const historiales = new Set(), historial = {};

  cat = await api('/catalogos');
  const opcs = (arr, v = 'id', t = 'nombre') =>
    arr.map(o => `<option value="${o[v]}">${ui.esc(o[t])}</option>`).join('');
  document.getElementById('f-factor').innerHTML += opcs(cat.factores);
  document.getElementById('r-factor').innerHTML  = opcs(cat.factores);
  document.getElementById('r-resp').innerHTML   += opcs(cat.usuarios);
  const niveles = t => cat.niveles.filter(n => n.tipo === t)
    .map(n => `<option value="${n.valor}">${n.valor} — ${ui.esc(n.etiqueta)}</option>`).join('');
  document.getElementById('r-prob').innerHTML = niveles('probabilidad');
  document.getElementById('r-imp').innerHTML  = niveles('impacto');

  function subfactores() {
    const fid = Number(document.getElementById('r-factor').value);
    document.getElementById('r-subfactor').innerHTML = '<option value="">—</option>' +
      opcs(cat.subfactores.filter(s => s.factor_id === fid));
  }
  function recalcular() {
    const v = Number(document.getElementById('r-prob').value) * Number(document.getElementById('r-imp').value);
    const n = (cat.umbrales.find(x => v <= x.hasta) || cat.umbrales.at(-1)).nivel;
    document.getElementById('r-calc').innerHTML = `${v} de 25 &nbsp; ${ui.nivel(n)}`;
  }
  document.getElementById('r-factor').onchange = subfactores;
  document.getElementById('r-prob').onchange = recalcular;
  document.getElementById('r-imp').onchange  = recalcular;

  // ─── Ficha de cada riesgo ────────────────────────────────────────────────
  function ficha(r) {
    const abierta = abiertos.has(r.id);
    const enHistorial = historiales.has(r.id);
    const d = detalles[r.id];
    return `
    <article class="ficha" data-n="${ui.esc(r.residual_nivel)}" data-id="${r.id}">
      <div class="ficha-cuerpo">
        <div class="alto">
          <span class="codigo">${ui.esc(r.codigo)}</span>
          <h3>${ui.esc(r.descripcion)}</h3>
          ${ui.nivel(r.residual_nivel)}
        </div>
        <div class="meta">
          <span>${ui.esc(r.factor_nombre)}${r.subfactor_nombre ? ' · ' + ui.esc(r.subfactor_nombre) : ''}</span>
          <span>Estado: ${ui.esc(r.estado)}</span>
          <span>Responsable: ${ui.esc(r.responsable_nombre || 'sin asignar')}</span>
          ${Number(r.tareas_abiertas) ? `<span style="color:var(--nivel-alto);font-weight:500">${r.tareas_abiertas} tarea(s) abierta(s)</span>` : ''}
        </div>
      </div>
      ${abierta ? `<div class="info">${d ? panelInfo(d) : '<p class="sin-dato">Cargando…</p>'}</div>` : ''}
      ${enHistorial ? `<div class="info">${
        historial[r.id] ? panelHistorial(r, historial[r.id]) : '<p class="sin-dato">Cargando…</p>'
      }</div>` : ''}
      <div class="pie">
        <button class="accion" data-info="${r.id}">${abierta ? '− Menos' : '+ Info'}</button>
        ${puede('tareas.ver') ? `<button class="accion" data-historial="${r.id}">
          ${enHistorial ? '− Historial' : 'Historial'}${
            Number(r.tareas_count) ? ` (${r.tareas_count})` : ''}</button>` : ''}
        ${puede('riesgos.editar') ? `<button class="accion" data-editar="${r.id}">Editar</button>` : ''}
        ${puede('tareas.crear')   ? `<button class="accion primario" data-tarea="${r.id}">+ Tarea</button>` : ''}
        ${puede('riesgos.aprobar') && r.estado !== 'Aprobado'
          ? `<button class="accion" data-aprobar="${r.id}">Aprobar</button>` : ''}
      </div>
    </article>`;
  }

  /** 'Alta', 'Catastrófico'…: el número de la escala, solo, no dice qué
   *  significa. La etiqueta sale del mismo catálogo que usa el formulario. */
  const etiquetaNivel = (tipo, valor) =>
    cat.niveles.find(n => n.tipo === tipo && Number(n.valor) === Number(valor))?.etiqueta || '';

  const efectividadPromedio = controles =>
    ui.num(controles.reduce((a, c) => a + Number(c.efectividad), 0) / controles.length, 1);

  /** El "+ info" junta cuatro cosas: las cifras del riesgo, qué es este tipo
   *  de riesgo, qué casos abarca, y qué pasa con este en particular. */
  function panelInfo(d) {
    const ejemplos = (d.subfactor_ejemplos || '').split('\n').filter(Boolean);
    const cifra = (et, v, pie = '') =>
      `<div class="cifra"><div class="et">${et}</div><div class="v">${v}</div>
       ${pie ? `<div class="sub-cifra">${pie}</div>` : ''}</div>`;
    return `
      <h4>Valoración</h4>
      <div class="cifras">
        ${cifra('Probabilidad', `${d.probabilidad} / 5`,
                ui.esc(etiquetaNivel('probabilidad', d.probabilidad)))}
        ${cifra('Impacto', `${d.impacto} / 5`,
                ui.esc(etiquetaNivel('impacto', d.impacto)))}
        ${cifra('Inherente', ui.num(d.inherente_valor, 1), ui.esc(d.inherente_nivel))}
        ${cifra('Residual', ui.num(d.residual_valor, 1), ui.esc(d.residual_nivel))}
        ${cifra('Controles', d.controles.length,
                d.controles.length ? `efectividad ${efectividadPromedio(d.controles)} / 5`
                                   : 'sin mitigar')}
        ${cifra('Tareas', d.tareas_count,
                Number(d.tareas_abiertas) ? `${d.tareas_abiertas} sin cerrar` : 'ninguna abierta')}
      </div>

      <h4>Qué significa este tipo de riesgo</h4>
      ${d.subfactor_orientacion
        ? `<div class="caja"><p>${ui.esc(d.subfactor_orientacion)}</p></div>`
        : `<p class="sin-dato">Este riesgo no tiene subfactor asignado, así que no hay
           orientación de categoría. Se agrega desde la pantalla de catálogos.</p>`}

      ${ejemplos.length ? `<h4>Casos típicos</h4>
        <ul>${ejemplos.map(e => `<li>${ui.esc(e)}</li>`).join('')}</ul>` : ''}

      <h4>Situación en la entidad</h4>
      ${d.contexto ? `<p>${ui.esc(d.contexto)}</p>`
        : '<p class="sin-dato">Sin contexto cargado. Se agrega con «Editar».</p>'}
      ${d.referencia ? `<p style="margin-top:8px;font-size:12.5px;color:var(--ink-muted)">
        Referencia: ${ui.esc(d.referencia)}</p>` : ''}

      <h4>Cómo se calculó</h4>
      <p>Probabilidad ${d.probabilidad} × impacto ${d.impacto} =
         <strong>${ui.num(d.inherente_valor, 1)}</strong> de 25 (${ui.esc(d.inherente_nivel)}).
         ${d.controles.length
            ? `Los ${d.controles.length} control(es) cargados lo bajan a
               <strong>${ui.num(d.residual_valor, 1)}</strong> (${ui.esc(d.residual_nivel)}).`
            : 'Sin controles cargados, el residual es igual al inherente.'}</p>

      <h4>Controles</h4>
      ${d.controles.length ? `<ul>${d.controles.map(c =>
          `<li>${ui.esc(c.descripcion)} — <em>${ui.esc(c.tipo)}</em>,
           efectividad ${c.efectividad}/5${c.documentado ? ', documentado' : ''}</li>`).join('')}</ul>`
        : '<p class="sin-dato">Ninguno. El riesgo está sin mitigar.</p>'}

      <p style="margin-top:12px;font-size:12.5px;color:var(--ink-muted)">
        Las tareas de este riesgo están en «Historial».</p>`;
  }

  /** Los cuatro grupos que pidió el área. El total son «las tareas creadas»:
   *  no es un grupo aparte, es la suma, y por eso va arriba como resumen. */
  const GRUPOS = [
    { g: 'sin-iniciar', titulo: 'Sin iniciar', estados: ['Pendiente'] },
    { g: 'en-proceso',  titulo: 'En proceso',  estados: ['En proceso', 'En revision'] },
    { g: 'completada',  titulo: 'Completadas', estados: ['Completada'] },
    { g: 'cancelada',   titulo: 'Canceladas',  estados: ['Cancelada'] },
  ];

  const HOY = () => new Date().toISOString().slice(0, 10);

  function lineaTarea(t) {
    const cerrada = t.estado === 'Completada' || t.estado === 'Cancelada';
    const vencida = !cerrada && t.fecha_limite && t.fecha_limite.slice(0, 10) < HOY();
    return `<li class="hist-item">
      <div class="hist-fila">
        <span class="codigo">${ui.esc(t.codigo)}</span>
        <a class="hist-titulo" href="Tarea.html?id=${t.id}" data-tarea="${t.id}">${ui.esc(t.titulo)}</a>
        <span class="etiqueta">${ui.esc(t.tipo)}${
          t.categoria_especial ? ' · ' + ui.esc(t.categoria_especial) : ''}</span>
        ${Number(t.confidencial) ? '<span class="etiqueta reservado">Reservado</span>' : ''}
        ${Number(t.hallazgos_count) ? `<span class="etiqueta">${t.hallazgos_count} hallazgo(s)</span>` : ''}
      </div>
      <div class="hist-meta">
        <span>${ui.esc(t.responsable_nombre || 'sin responsable')}</span>
        <span>Programada ${ui.fecha(t.fecha_programada)}</span>
        ${t.fecha_limite ? `<span class="${vencida ? 'vencida' : ''}">Límite ${
          ui.fecha(t.fecha_limite)}${vencida ? ' · vencida' : ''}</span>` : ''}
        ${t.completada_en ? `<span>Cerrada ${ui.fecha(t.completada_en)}</span>` : ''}
        <span>Prioridad ${ui.esc(t.prioridad)}</span>
        ${Number(t.traspasos) ? `<span>${t.traspasos} traspaso(s)</span>` : ''}
      </div></li>`;
  }

  function panelHistorial(r, tareas) {
    if (!tareas.length) return `
      <h4>Historial de tareas</h4>
      <p class="sin-dato">Todavía no hay ninguna tarea sobre ${ui.esc(r.codigo)}.
         Se crean con «+ Tarea».</p>`;

    const cuenta = est => tareas.filter(t => est.includes(t.estado)).length;
    const cifra = (et, v) => `<div class="cifra"><div class="et">${et}</div>
      <div class="v">${v}</div></div>`;

    // Lo que el servidor oculta no se puede contar acá: si falta algo, es porque
    // el cargo no lo puede ver, y el aviso evita que se lea como "no hay nada".
    const faltan = Number(r.tareas_count) - tareas.length;

    return `
      <h4>Historial de tareas</h4>
      <div class="hist-resumen">
        ${cifra('Creadas', tareas.length)}
        ${GRUPOS.map(x => cifra(x.titulo, cuenta(x.estados))).join('')}
      </div>
      ${faltan > 0 ? `<p class="sin-dato" style="margin-top:10px">${faltan} caso(s)
        reservado(s) no se muestran con su cargo.</p>` : ''}
      ${GRUPOS.map(x => {
        const del = tareas.filter(t => x.estados.includes(t.estado));
        if (!del.length) return '';
        return `<div class="hist-grupo" data-g="${x.g}">
          <h5>${x.titulo} <span class="cuenta">(${del.length})</span></h5>
          <ul class="hist-lista">${del.map(lineaTarea).join('')}</ul></div>`;
      }).join('')}`;
  }

  function paginador(paginas, total) {
    const b = (n, txt, dis, cur) =>
      `<button data-pag="${n}"${dis ? ' disabled' : ''}${cur ? ' aria-current="page"' : ''}>${txt}</button>`;
    let nums = '';
    for (let i = 1; i <= paginas; i++) nums += b(i, i, false, i === pag);
    return `<div class="paginador">${b(pag - 1, '‹', pag <= 1)}${nums}${b(pag + 1, '›', pag >= paginas)}
      <span class="rango">${total} riesgo(s)</span></div>`;
  }

  function pintar() {
    const caja = document.getElementById('fichas');
    if (!lista.length) {
      caja.innerHTML = '<div class="tarjeta vacio">No hay riesgos que coincidan con el filtro.</div>';
      return;
    }
    const paginar = lista.length > UMBRAL_PAGINAR;
    const paginas = paginar ? Math.ceil(lista.length / POR_PAGINA) : 1;
    pag = Math.min(Math.max(1, pag), paginas);
    const enPagina = paginar ? lista.slice((pag - 1) * POR_PAGINA, pag * POR_PAGINA) : lista;
    caja.innerHTML = enPagina.map(ficha).join('') + (paginar ? paginador(paginas, lista.length) : '');
  }

  // ─── Acciones ────────────────────────────────────────────────────────────
  document.getElementById('fichas').addEventListener('click', async e => {
    const pb = e.target.closest('.paginador button[data-pag]');
    if (pb) { pag = Number(pb.dataset.pag); pintar();
              document.getElementById('fichas').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    // El título de una tarea en el historial abre su informe en un modal.
    const enlace = e.target.closest('a.hist-titulo');
    if (enlace) { e.preventDefault(); return verTarea(Number(enlace.dataset.tarea)); }

    const b = e.target.closest('button[data-info],button[data-historial],button[data-editar],button[data-tarea],button[data-aprobar]');
    if (!b) return;
    const id = Number(b.dataset.info || b.dataset.historial || b.dataset.editar
                      || b.dataset.tarea || b.dataset.aprobar);
    try {
      if (b.dataset.info) {
        if (abiertos.has(id)) abiertos.delete(id);
        else { abiertos.add(id); if (!detalles[id]) { pintar(); detalles[id] = await api(`/riesgos/${id}`); } }
        return pintar();
      }
      if (b.dataset.historial) {
        if (historiales.has(id)) historiales.delete(id);
        else {
          historiales.add(id);
          // Pintar primero deja el panel con el «Cargando…» mientras va el pedido.
          if (!historial[id]) { pintar(); historial[id] = await traerHistorial(id); }
        }
        return pintar();
      }
      if (b.dataset.editar)  return editar(id);
      if (b.dataset.tarea)   return nuevaTarea(id);
      if (b.dataset.aprobar) {
        await api(`/riesgos/${id}/estado`, { method: 'POST', cuerpo: { estado: 'Aprobado' } });
        return ui.aviso('Riesgo aprobado', 'ok');
      }
    } catch (err) { ui.aviso(err.message); }
  });

  // ─── Alta y edición ──────────────────────────────────────────────────────
  const caja = document.getElementById('caja-form');
  if (puede('riesgos.crear')) document.getElementById('btn-nuevo').hidden = false;
  document.getElementById('btn-cancelar').onclick = () => { caja.hidden = true; };

  document.getElementById('btn-nuevo').onclick = () => {
    document.getElementById('form').reset();
    document.getElementById('r-id').value = '';
    document.getElementById('r-fecha').value = new Date().toISOString().slice(0, 10);
    document.getElementById('form-titulo').textContent = 'Nuevo riesgo';
    subfactores(); recalcular();
    caja.hidden = false;
    caja.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  async function editar(id) {
    const r = detalles[id] || await api(`/riesgos/${id}`);
    detalles[id] = r;
    for (const [campo, valor] of [
      ['r-id', r.id], ['r-codigo', r.codigo], ['r-factor', r.factor_id],
      ['r-desc', r.descripcion], ['r-contexto', r.contexto || ''],
      ['r-prob', r.probabilidad], ['r-imp', r.impacto],
      ['r-resp', r.responsable_id || ''], ['r-ref', r.referencia || ''],
      ['r-fecha', String(r.fecha_identificacion).slice(0, 10)],
    ]) document.getElementById(campo).value = valor;
    subfactores();
    document.getElementById('r-subfactor').value = r.subfactor_id || '';
    recalcular();
    document.getElementById('form-titulo').textContent = `Editar ${r.codigo}`;
    caja.hidden = false;
    caja.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('r-id').value;
    const cuerpo = {
      evaluacion_id: cat.evaluaciones.find(x => x.estado === 'Abierta')?.id || cat.evaluaciones[0]?.id,
      codigo:       document.getElementById('r-codigo').value.trim(),
      factor_id:    Number(document.getElementById('r-factor').value),
      subfactor_id: document.getElementById('r-subfactor').value || null,
      descripcion:  document.getElementById('r-desc').value.trim(),
      contexto:     document.getElementById('r-contexto').value.trim() || null,
      referencia:   document.getElementById('r-ref').value.trim() || null,
      probabilidad: Number(document.getElementById('r-prob').value),
      impacto:      Number(document.getElementById('r-imp').value),
      responsable_id: document.getElementById('r-resp').value || null,
      fecha_identificacion: document.getElementById('r-fecha').value,
    };
    try {
      if (id) { await api(`/riesgos/${id}`, { method: 'PUT', cuerpo }); delete detalles[id]; }
      else      await api('/riesgos', { method: 'POST', cuerpo });
      caja.hidden = true;
      ui.aviso(id ? 'Riesgo actualizado' : 'Riesgo creado', 'ok');
    } catch (err) { ui.aviso(err.message); }
  });

  // ─── + Tarea sobre un riesgo ─────────────────────────────────────────────
  // La carga de una tarea pasó a ser una pantalla propia (informe completo:
  // antecedentes, hallazgos, recomendaciones y plan de acción). Desde acá solo
  // se abre esa pantalla, ya apuntada al riesgo.
  function nuevaTarea(idRiesgo) {
    MDP.modalTarea(`riesgo=${idRiesgo}`, async res => {
      if (res.accion !== 'creada') return;
      ui.aviso('Tarea creada correctamente', 'ok');
      if (puede('tareas.ver')) historiales.add(idRiesgo);   // se ve en el acto
      await cargar();
    });
  }

  // Abre el informe de una tarea existente en el modal (ver o editar).
  function verTarea(idTarea) {
    MDP.modalTarea(`id=${idTarea}`, async res => {
      if (res.accion === 'editada') ui.aviso('Tarea actualizada correctamente', 'ok');
      if (res.accion === 'editada') await cargar();
    });
  }

  /** Todas las tareas del riesgo, en cualquier estado. El servidor ya quita
   *  las que el cargo no puede ver, así que acá no hay nada que filtrar. */
  const traerHistorial = id => api(`/tareas?riesgo=${id}`);

  // ─── Carga ───────────────────────────────────────────────────────────────
  let filtroTexto = '';
  async function cargar() {
    const q = new URLSearchParams();
    for (const [campo, clave] of [['f-factor','factor'], ['f-nivel','nivel'], ['f-estado','estado']]) {
      const v = document.getElementById(campo).value;
      if (v) q.set(clave, v);
    }
    try {
      lista = await api(`/riesgos?${q}`);
      if (filtroTexto) {
        const t = filtroTexto.toLowerCase();
        lista = lista.filter(r => (r.codigo + ' ' + r.descripcion).toLowerCase().includes(t));
      }
      for (const id of [...abiertos]) if (!lista.some(r => r.id === id)) abiertos.delete(id);
      for (const id of abiertos) detalles[id] = await api(`/riesgos/${id}`);
      // Los historiales abiertos se vuelven a traer: una tarea que acaba de
      // cambiar de estado tiene que saltar de grupo sin tocar el botón.
      for (const id of [...historiales]) {
        if (!lista.some(r => r.id === id)) { historiales.delete(id); delete historial[id]; }
        else historial[id] = await traerHistorial(id);
      }
      pintar();
    } catch (e) { ui.aviso(e.message); }
  }

  for (const id of ['f-factor', 'f-nivel', 'f-estado'])
    document.getElementById(id).onchange = () => { pag = 1; cargar(); };
  let reloj;
  document.getElementById('f-buscar').oninput = e => {
    filtroTexto = e.target.value.trim(); pag = 1;
    clearTimeout(reloj); reloj = setTimeout(cargar, 250);
  };

  subfactores(); recalcular();
  await cargar();
  MDP.vivo.al('riesgos', cargar);
  MDP.vivo.al('tareas',  cargar);   // el contador de tareas del riesgo se actualiza solo
})();
</script>
</body>
